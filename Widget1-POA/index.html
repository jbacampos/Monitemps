<div class="card poa">

    <!-- ==================== LOCALIDADE ==================== -->
    <div class="location-title">POA</div>


    <!-- ============ EXTERNO E INTERNO LADO A LADO ============ -->
    <div class="sections">

        <!-- ==================== EXTERNO ==================== -->
        <section class="section externo">

            <div class="section-title">Externo</div>

            <div class="temp">
                <span id="poaExtTemp">--.-</span>
                <span class="unit">°C</span>
            </div>

            <div class="data-grid">

                <div class="data-line">
                    <span class="data-label">Umidade relativa do ar</span>
                    <span class="data-value"><b id="poaExtHumid">--.-</b> <i>%</i></span>
                </div>

                <div class="data-line">
                    <span class="data-label">Sensação térmica</span>
                    <span class="data-value"><b id="poaExtFeels">--.-</b> <i>°C</i></span>
                </div>

                <div class="data-line">
                    <span class="data-label">Ponto de orvalho</span>
                    <span class="data-value"><b id="poaExtDew">--.-</b> <i>°C</i></span>
                </div>

            </div>

            <div id="poaExtTimestamp" class="timestamp">
                --/--- --:--
            </div>

        </section>


        <!-- ==================== INTERNO ==================== -->
        <section class="section interno">

            <div class="section-title">Interno</div>

            <div class="temp">
                <span id="poaIntTemp">--.-</span>
                <span class="unit">°C</span>
            </div>

            <div class="data-grid">

                <div class="data-line">
                    <span class="data-label">Umidade relativa do ar</span>
                    <span class="data-value"><b id="poaIntHumid">--.-</b> <i>%</i></span>
                </div>

            </div>

            <div id="poaIntTimestamp" class="timestamp">
                --/--- --:--
            </div>

        </section>

    </div>


    <!-- ==================== RODAPÉ ==================== -->
    <div class="last-update-row">

        <div
            id="lastUpdate"
            class="last-update">
            Dados: --/--- --:--
        </div>

        <button
            id="refreshButton"
            class="refresh-button"
            title="Atualizar">
            ↻
        </button>

    </div>

</div>
